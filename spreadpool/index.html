<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Spread'em Pool</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏈</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&family=Barlow:wght@400;500;600;700&family=Spline+Sans+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --felt:#0a1f14; --felt2:#0e2a1b; --line:#1d4230;
  --paper:#f4eddc; --paper2:#efe5cd; --ink:#20241f; --ink2:#6b6a5c;
  --gold:#d9a441; --gold2:#b8862e;
  --red:#c0392b; --win:#2e7d4f; --push:#8a7f4e;
  --shadow:0 10px 30px rgba(0,0,0,.45);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{
  font-family:'Barlow',sans-serif;color:var(--paper);background:var(--felt);
  background-image:
    radial-gradient(1200px 500px at 50% -10%, rgba(217,164,65,.10), transparent 60%),
    repeating-linear-gradient(45deg, rgba(255,255,255,.012) 0 2px, transparent 2px 6px);
  min-height:100vh;padding-bottom:90px;
}
.wrap{max-width:640px;margin:0 auto;padding:0 14px}

/* ---------- header ---------- */
header{padding:18px 0 10px;text-align:center}
.wordmark{font-family:'Big Shoulders Display';font-weight:800;font-size:clamp(34px,9vw,52px);
  letter-spacing:.04em;line-height:.9;color:var(--paper);text-transform:uppercase}
.wordmark span{color:var(--gold)}
.tagline{font-family:'Spline Sans Mono';font-size:11px;letter-spacing:.32em;color:var(--gold);
  text-transform:uppercase;margin-top:6px;opacity:.85}
.rule{height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);margin:14px auto 0;max-width:420px;opacity:.5}

/* ---------- login ---------- */
.login-card{background:var(--paper);color:var(--ink);border-radius:6px;margin:26px auto;max-width:420px;
  padding:26px 22px 22px;box-shadow:var(--shadow);position:relative}
.login-card:before,.login-card:after{content:"";position:absolute;left:0;right:0;height:8px;
  background-image:radial-gradient(circle at 6px 4px, var(--felt) 4px, transparent 4.5px);background-size:16px 8px}
.login-card:before{top:-4px}.login-card:after{bottom:-4px;transform:scaleY(-1)}
.login-card h2{font-family:'Big Shoulders Display';font-weight:800;font-size:26px;text-transform:uppercase;letter-spacing:.03em}
.login-card p{font-size:13.5px;color:var(--ink2);margin:6px 0 16px;line-height:1.45}
label{display:block;font-family:'Spline Sans Mono';font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--ink2);margin:12px 0 5px}
input,select{width:100%;font-family:'Barlow';font-size:16px;font-weight:600;color:var(--ink);
  background:#fff;border:1.5px solid #cfc4a6;border-radius:4px;padding:11px 12px;outline:none}
input:focus,select:focus{border-color:var(--gold2)}
.btn{display:inline-block;width:100%;margin-top:18px;font-family:'Big Shoulders Display';font-weight:800;
  font-size:19px;letter-spacing:.08em;text-transform:uppercase;color:var(--felt);
  background:linear-gradient(180deg,var(--gold),var(--gold2));border:none;border-radius:4px;
  padding:13px;cursor:pointer;transition:transform .08s}
.btn:active{transform:scale(.98)}
.btn.small{width:auto;font-size:15px;padding:9px 16px;margin-top:0}
.btn.ghost{background:transparent;color:var(--gold);border:1.5px solid var(--gold2)}
.btn.danger{background:linear-gradient(180deg,#d05545,#a63527);color:#fff}
.btn[disabled]{opacity:.5;pointer-events:none}

/* ---------- tabs ---------- */
nav{position:fixed;bottom:0;left:0;right:0;z-index:40;background:rgba(8,22,14,.96);backdrop-filter:blur(8px);
  border-top:1px solid var(--line);display:flex;justify-content:center;gap:2px;padding:6px 8px calc(8px + env(safe-area-inset-bottom))}
nav button{flex:1;max-width:150px;background:none;border:none;color:#87a794;cursor:pointer;
  font-family:'Big Shoulders Display';font-weight:800;font-size:16px;letter-spacing:.08em;text-transform:uppercase;padding:10px 4px;border-radius:6px}
nav button.on{color:var(--felt);background:linear-gradient(180deg,var(--gold),var(--gold2))}

/* ---------- league switcher (Picks) ---------- */
.segbar{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px;margin:16px 0 4px;
  background:var(--felt2);border:1px solid var(--line);border-radius:8px;padding:5px}
.seg{background:none;border:none;border-radius:6px;cursor:pointer;padding:9px 6px 8px;color:#87a794;
  display:flex;flex-direction:column;align-items:center;gap:2px;transition:background .12s,color .12s}
.seg .sl{font-family:'Big Shoulders Display';font-weight:800;font-size:19px;letter-spacing:.07em;text-transform:uppercase;line-height:1}
.seg .sc{font-family:'Spline Sans Mono';font-weight:700;font-size:11px;letter-spacing:.1em;opacity:.8}
.seg.on{background:linear-gradient(180deg,var(--gold),var(--gold2));color:var(--felt)}
.seg.on .sc{opacity:.9}
.seg .sc.full{color:var(--win);filter:brightness(1.7)}
.seg.on .sc.full{color:var(--felt);filter:none}

/* ---------- collapsible game groups ---------- */
.grouphead{width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;
  background:var(--felt2);border:1px solid var(--line);border-radius:6px;padding:11px 13px;margin:12px 0 0;
  color:var(--paper);cursor:pointer;text-align:left;font-family:'Barlow'}
.grouphead .gt{font-family:'Big Shoulders Display';font-weight:800;font-size:19px;letter-spacing:.07em;text-transform:uppercase}
.grouphead .gn{font-family:'Spline Sans Mono';font-size:11px;font-weight:700;color:#87a794;letter-spacing:.1em;margin-left:9px}
.grouphead .gn.has{color:var(--gold)}
.grouphead .gc{font-size:13px;color:var(--gold);transition:transform .18s;flex:none}
.grouphead.open{border-color:var(--gold2)}
.grouphead.open .gc{transform:rotate(180deg)}
.groupbody{padding-top:2px}
.groupbody.shut{display:none}
.rk{display:inline-block;font-family:'Spline Sans Mono';font-size:10px;font-weight:700;
  background:var(--felt);color:var(--gold);border-radius:3px;padding:1px 4px;margin-right:5px;vertical-align:1px}
.side.mine .rk{background:var(--gold);color:var(--felt)}
.mv{display:block;font-family:'Spline Sans Mono';font-size:10px;font-weight:700;
  letter-spacing:.06em;color:#9a7b2f;margin-top:2px}
.side.mine .mv{color:#b99243}

/* ---------- standings splits ---------- */
.splitcard{background:var(--felt2);border:1px solid var(--line);border-radius:7px;padding:10px 12px 12px;margin:9px 0}
.splitcard.me{border-color:var(--gold2);background:rgba(217,164,65,.07)}
.splitcard .who{font-family:'Big Shoulders Display';font-weight:800;font-size:19px;letter-spacing:.05em;
  text-transform:uppercase;margin-bottom:8px;display:flex;justify-content:space-between;align-items:baseline}
.splitcard .who .tot{font-family:'Spline Sans Mono';font-size:12px;font-weight:700;color:var(--gold);letter-spacing:.08em}
.cells{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.cell{background:rgba(10,31,20,.55);border:1px solid rgba(29,66,48,.9);border-radius:5px;padding:7px 8px}
.cell .k{font-family:'Spline Sans Mono';font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:#87a794}
.cell .v{font-family:'Spline Sans Mono';font-weight:700;font-size:16px;margin-top:2px;color:var(--paper)}
.cell .v.up{color:var(--win);filter:brightness(1.6)}
.cell .v.down{color:var(--red);filter:brightness(1.25)}
.cell .v.none{color:#5c7a68}

/* ---------- week bar ---------- */
.weekbar{display:flex;align-items:center;gap:10px;margin:14px 0 4px}
.weekbar select{flex:1;background:var(--felt2);color:var(--paper);border:1px solid var(--line);font-weight:700}
.userchip{font-family:'Spline Sans Mono';font-size:11px;color:var(--gold);letter-spacing:.08em;white-space:nowrap;cursor:pointer}

/* ---------- countdown strips ---------- */
.lockstrip{display:flex;justify-content:space-between;align-items:center;background:var(--felt2);
  border:1px solid var(--line);border-radius:6px;padding:9px 13px;margin:10px 0}
.lockstrip .lg{font-family:'Big Shoulders Display';font-weight:800;font-size:18px;letter-spacing:.1em;text-transform:uppercase}
.lockstrip .cd{font-family:'Spline Sans Mono';font-weight:700;font-size:15px;color:var(--gold)}
.lockstrip.closed .cd{color:var(--red)}
.lockstrip .sub{font-size:11px;color:#87a794;display:block;font-family:'Barlow';letter-spacing:0}
.linenote{font-size:12px;color:#87a794;line-height:1.45;margin:-2px 0 10px;padding:0 2px}
.linenote b{color:var(--gold);font-weight:600}
.revstrip{background:var(--felt2);border:1px solid var(--line);border-radius:6px;padding:9px 13px;margin:0 0 10px;font-size:13px;line-height:1.8}
.revstrip b{color:var(--gold)}
.revstrip .cdi{font-family:'Spline Sans Mono';color:var(--gold);font-weight:700;font-size:12px}
.egg{background:none;border:1.5px dashed rgba(244,237,220,.25);border-radius:5px;font-size:14px;line-height:1;padding:3px 7px;cursor:pointer;margin-left:8px;opacity:.5;transition:all .12s}
.egg.on{opacity:1;border-style:solid;border-color:var(--gold2);background:rgba(217,164,65,.15);transform:scale(1.1)}
.eggflags{margin-left:6px;font-size:13px;cursor:default}

/* ---------- section heads ---------- */
.sechead{display:flex;align-items:baseline;justify-content:space-between;margin:22px 0 8px}
.sechead h3{font-family:'Big Shoulders Display';font-weight:800;font-size:24px;letter-spacing:.06em;text-transform:uppercase}
.sechead .count{font-family:'Spline Sans Mono';font-size:13px;font-weight:700;color:var(--gold)}
.sechead .count.full{color:var(--win);filter:brightness(1.6)}

/* ---------- game tickets ---------- */
.ticket{background:var(--paper);color:var(--ink);border-radius:5px;margin:10px 0;box-shadow:0 4px 14px rgba(0,0,0,.35);
  position:relative;overflow:hidden}
.ticket .meta{display:flex;justify-content:space-between;font-family:'Spline Sans Mono';font-size:10px;
  letter-spacing:.14em;text-transform:uppercase;color:var(--ink2);padding:8px 12px 0}
.sides{display:grid;grid-template-columns:1fr 1fr;gap:0;padding:8px 10px 12px}
.side{border:1.5px solid #d8ccab;background:#fbf7ec;padding:10px 10px 9px;cursor:pointer;position:relative;transition:all .12s}
.side:first-child{border-radius:4px 0 0 4px;border-right-width:.75px}
.side:last-child{border-radius:0 4px 4px 0;border-left-width:.75px}
.side .tm{font-weight:700;font-size:14.5px;line-height:1.15}
.side .sp{font-family:'Spline Sans Mono';font-weight:700;font-size:17px;margin-top:3px;color:var(--ink)}
.side .sp.fav{color:var(--red)}
.side.mine{background:var(--felt2);border-color:var(--gold2);}
.side.mine .tm{color:var(--paper)}
.side.mine .sp{color:var(--gold)}
.side.mine:after{content:"YOUR PICK";position:absolute;top:4px;right:6px;font-family:'Spline Sans Mono';font-size:8px;letter-spacing:.14em;color:var(--gold)}
.side.dead{cursor:default;opacity:.75}
.ticket.locked .side{cursor:default}
.score{font-family:'Spline Sans Mono';font-weight:700;font-size:13px;color:var(--ink2);padding:0 12px 9px}
.score b{color:var(--ink)}

/* rubber stamps */
.stamp{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) rotate(-11deg);
  font-family:'Big Shoulders Display';font-weight:800;font-size:26px;letter-spacing:.14em;
  padding:2px 12px;border:3px solid;border-radius:4px;opacity:.9;pointer-events:none;mix-blend-mode:multiply}
.stamp.win{color:var(--win);border-color:var(--win)}
.stamp.loss{color:var(--red);border-color:var(--red)}
.stamp.push{color:var(--push);border-color:var(--push)}

/* ---------- board ---------- */
.playerblock{background:var(--felt2);border:1px solid var(--line);border-radius:6px;padding:12px 14px;margin:10px 0}
.playerblock h4{font-family:'Big Shoulders Display';font-weight:800;font-size:20px;letter-spacing:.06em;text-transform:uppercase;display:flex;justify-content:space-between;align-items:baseline}
.playerblock h4 .rec{font-family:'Spline Sans Mono';font-size:12px;color:var(--gold)}
.pickrow{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px dashed rgba(244,237,220,.12);font-size:14px}
.pickrow:last-child{border-bottom:none}
.pickrow .lg{font-family:'Spline Sans Mono';font-size:9px;letter-spacing:.16em;color:#87a794;width:30px}
.pickrow .who{flex:1;font-weight:600}
.pickrow .opp{display:block;color:#87a794;font-weight:400;font-size:11.5px;margin-top:1px}
.pickrow .num{font-family:'Spline Sans Mono';font-weight:700;font-size:13px;color:var(--gold);margin-left:8px}
.pickrow .res{font-family:'Spline Sans Mono';font-weight:700;font-size:11px;letter-spacing:.1em;margin-left:10px;padding:2px 7px;border-radius:3px}
.res.win{background:var(--win);color:#eafff2}.res.loss{background:var(--red);color:#ffecec}
.res.push{background:var(--push);color:#fffbe0}.res.tbd{background:#22483385;color:#87a794}
.hiddennote{font-size:12.5px;color:#87a794;font-style:italic;padding:6px 0}

/* ---------- standings ---------- */
table{width:100%;border-collapse:collapse;margin:12px 0}
th{font-family:'Spline Sans Mono';font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:#87a794;text-align:left;padding:8px 8px;border-bottom:1px solid var(--line)}
td{padding:11px 8px;border-bottom:1px solid rgba(29,66,48,.6);font-size:15px}
td.rank{font-family:'Big Shoulders Display';font-weight:800;font-size:20px;color:var(--gold);width:34px}
td.nm{font-weight:700}
td.mono,th.r{font-family:'Spline Sans Mono';font-weight:700}
th.r,td.r{text-align:right}
tr.me td{background:rgba(217,164,65,.07)}

/* ---------- admin ---------- */
.adm{background:var(--felt2);border:1px solid var(--line);border-radius:6px;padding:16px;margin:12px 0}
.adm h4{font-family:'Big Shoulders Display';font-weight:800;font-size:19px;letter-spacing:.07em;text-transform:uppercase;margin-bottom:4px;color:var(--gold)}
.adm p.hint{font-size:12.5px;color:#87a794;margin-bottom:10px;line-height:1.4}
.adm input,.adm select{background:#0a1c12;color:var(--paper);border-color:var(--line)}
.adm label{color:#87a794}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.pillrow{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px dashed rgba(244,237,220,.12);font-size:14px}
.pillrow .a{display:flex;gap:6px}
.pillrow button{background:none;border:1px solid var(--line);color:#87a794;border-radius:4px;font-size:11px;padding:3px 8px;cursor:pointer;font-family:'Spline Sans Mono'}
.quota{font-family:'Spline Sans Mono';font-size:11px;color:#87a794;margin-top:8px}

/* ---------- toast / misc ---------- */
#toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%) translateY(20px);background:var(--paper);color:var(--ink);
  font-weight:600;font-size:14px;padding:11px 18px;border-radius:6px;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:all .25s;z-index:60;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#toast.bad{background:var(--red);color:#fff}
.empty{text-align:center;color:#87a794;padding:34px 10px;font-size:14.5px;line-height:1.5}
.empty .big{font-family:'Big Shoulders Display';font-weight:800;font-size:22px;letter-spacing:.06em;text-transform:uppercase;color:var(--paper);display:block;margin-bottom:6px}
.fade{animation:fadeup .35s ease both}
@keyframes fadeup{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.hide{display:none!important}

/* ---------- trends ---------- */
/* Player slots: validated on both felt surfaces (adjacent ΔE ≥ 8.4 CVD, ≥ 19.8 normal, all ≥ 3:1).
   Lines are also end-labeled by name, so identity never rests on color alone. */
:root{ --p0:#3987e5; --p1:#d95926; --p2:#199e70; --p3:#c98500;
  --pos1:#1c5cab; --pos2:#256abf; --pos3:#6da7ec; --neg1:#8f3a3a; --neg2:#b04444; --neg3:#ec8a8a; --mid:#2c4236;
  --grid:#1a3a29; --axis:#2f5641; --muted:#87a794 }
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;background:var(--felt2);border:1px solid var(--line);color:var(--muted);border-radius:999px;
  font-family:'Spline Sans Mono';font-weight:700;font-size:11px;letter-spacing:.08em;text-transform:uppercase;padding:8px 12px;cursor:pointer}
.chip.on{background:linear-gradient(180deg,var(--gold),var(--gold2));color:var(--felt);border-color:var(--gold2)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin:6px 0 10px}
.lg-item{display:flex;align-items:center;gap:6px;background:none;border:none;color:var(--muted);font-family:'Barlow';font-weight:700;font-size:14px;cursor:pointer;padding:4px 0}
.lg-item i,.tile i,.tr i,.heat td.nm i,.eg-nm i{display:inline-block;width:10px;height:10px;border-radius:3px;flex:none}
.lg-item.on{color:var(--paper)}
.lg-item em{font-style:normal;font-family:'Spline Sans Mono';font-size:9px;letter-spacing:.14em;color:var(--gold);text-transform:uppercase}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:4px 0 10px}
.tile{background:var(--felt2);border:1px solid var(--line);border-radius:7px;padding:9px 10px;min-width:0}
.tile .tk{font-family:'Spline Sans Mono';font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.tile .tv{display:flex;align-items:center;gap:6px;font-family:'Big Shoulders Display';font-weight:800;font-size:19px;letter-spacing:.04em;text-transform:uppercase;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .ts{font-size:12px;color:var(--muted);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .ts b{font-family:'Spline Sans Mono';color:var(--gold)}
.chartcard{background:var(--felt2);border:1px solid var(--line);border-radius:8px;padding:12px 12px 10px;margin:10px 0}
.ch-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:6px}
.ch-head h4{font-family:'Big Shoulders Display';font-weight:800;font-size:20px;letter-spacing:.06em;text-transform:uppercase}
.ch-sub{font-size:12px;color:var(--muted);line-height:1.35;margin-top:1px}
.mini-seg{display:flex;background:var(--felt);border:1px solid var(--line);border-radius:6px;padding:3px;gap:2px;flex:none}
.mini-seg.wide{margin:2px 0 8px}
.mini-seg.wide button{flex:1}
.mini-seg button{background:none;border:none;color:var(--muted);font-family:'Spline Sans Mono';font-weight:700;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;padding:7px 9px;border-radius:4px;cursor:pointer}
.mini-seg button.on{background:var(--gold);color:var(--felt)}
.plot{position:relative;width:100%;touch-action:pan-y}
.plot svg{display:block;overflow:visible}
.g-line{stroke:var(--grid);stroke-width:1}
.g-zero{stroke:var(--axis);stroke-width:1.5}
.g-tick{font-family:'Spline Sans Mono';font-size:10px;fill:var(--muted)}
.g-end{font-family:'Barlow';font-weight:700;font-size:12px;fill:var(--muted)}
.g-end.on{fill:var(--paper)}
.g-endv{font-family:'Spline Sans Mono';font-size:10.5px}
.g-cross{stroke:var(--paper);stroke-opacity:.35;stroke-width:1}
.tip{position:absolute;z-index:5;pointer-events:none;background:var(--paper);color:var(--ink);border-radius:6px;padding:8px 10px;
  box-shadow:0 8px 22px rgba(0,0,0,.45);min-width:150px}
.tip .tt{font-family:'Spline Sans Mono';font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink2);margin-bottom:4px}
.tip .tr{display:grid;grid-template-columns:10px 1fr auto auto;align-items:center;gap:7px;font-size:13px;line-height:1.55}
.tip .tr.on span{font-weight:700}
.tip .tr b{font-family:'Spline Sans Mono';font-size:12px}
.tip .tr em{font-style:normal;font-family:'Spline Sans Mono';font-size:11px;color:var(--ink2)}
.linkbtn{background:none;border:none;color:var(--gold);font-family:'Spline Sans Mono';font-size:11px;letter-spacing:.08em;cursor:pointer;padding:6px 0 0}
.tblwrap{overflow-x:auto;margin-top:4px}
table.mini th,table.mini td{padding:6px 6px;font-size:12.5px}
table.heat{border-collapse:separate;border-spacing:3px;margin:0}
table.heat th{font-family:'Spline Sans Mono';font-size:9.5px;letter-spacing:.1em;color:var(--muted);padding:2px 0;text-align:center;border:none}
table.heat td{padding:0;border:none;font-size:13px}
table.heat td.nm{display:flex;align-items:center;gap:6px;font-weight:700;padding:0 6px 0 0;height:30px;white-space:nowrap;color:var(--muted);position:sticky;left:0;z-index:1;background:var(--felt2)}
table.heat th:first-child{position:sticky;left:0;z-index:1;background:var(--felt2)}
.heatwrap{scrollbar-width:thin}
table.heat tr.on td.nm{color:var(--paper)}
table.heat .tot{font-family:'Spline Sans Mono';font-weight:700;font-size:11px;color:var(--gold);text-align:right;padding-left:6px;white-space:nowrap}

      var k = b.getAttribute('data-grp');

      var nowOpen = b.classList.toggle('open');
      S.groupOpen[k] = nowOpen;
      if (body) body.classList.toggle('shut', !nowOpen);
    });
  });

  root.querySelectorAll('.seg[data-lg]').forEach(function(b){
    b.addEventListener('click', function(){
      if (S.pickLg === b.getAttribute('data-lg')) return;
      S.pickLg = b.getAttribute('data-lg');
      render();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });
  });

  root.querySelectorAll('.side[data-g]').forEach(function(b){
    b.addEventListener('click', function(){
      var gid = b.getAttribute('data-g'), side = b.getAttribute('data-s');
      var dd = S.data, mp = pickFor(gid, dd.me.id), call;
      // optimistic: update the UI instantly, let the server confirm in the background
      if (mp && mp.side === side) {
        dd.picks = dd.picks.filter(function(p){ return p !== mp; });
        call = api('/api/unpick', { game_id: gid });
      } else {
        if (mp) { mp.side = side; }
        else dd.picks.push({ id: 'tmp-' + gid, week_id: dd.week.id, player_id: dd.me.id, game_id: gid, side: side, spread_home_at_pick: null, result: null });
        call = api('/api/pick', { game_id: gid, side: side });
      }
      render();
      call.catch(function(e){ toast(e.message, true); load(); }); // server said no — roll back
    });
  });
}

// AP Top 25 rank for a team name, or null. ESPN and The Odds API agree on full team names.
function apRank(team){
  var ap = S.data && S.data.apRanks;
  return (ap && ap[team]) || null;
}
function rankBadge(team){
  var r = apRank(team);
  return r ? '<span class="rk">' + r + '</span>' : '';
}

// Line movement, measured against the first number we ever recorded for the game.
// A negative delta on the home spread means the line moved toward the home team.
function lineMove(g){
  if (g.spread_home === null || g.spread_home === undefined) return null;
  if (g.open_spread_home === null || g.open_spread_home === undefined) return null;
  var delta = Number(g.spread_home) - Number(g.open_spread_home);
  if (!delta || Math.abs(delta) < 0.5) return null;
  return { toward: delta < 0 ? 'home' : 'away', points: Math.abs(delta), open: Number(g.open_spread_home) };
}
function moveNote(g, side){
  var mv = lineMove(g);
  if (!mv || mv.toward !== side) return '';
  var openForSide = side === 'home' ? mv.open : -mv.open;
  return '<span class="mv" title="Opened at ' + fmtSpread(openForSide) + '">\u25b2 '
    + (mv.points % 1 === 0 ? mv.points : mv.points.toFixed(1)) + ' from ' + fmtSpread(openForSide) + '</span>';
}

function ticketHtml(g, locked){
  var d = S.data;
  var started = new Date(g.commence_time).getTime() <= now();
  var noLine = g.spread_home === null || g.spread_home === undefined;
  var frozen = locked || started || noLine;
  var mp = pickFor(g.id, d.me.id);
  var sp = Number(g.spread_home);
  var homeSp = fmtSpread(g.spread_home), awaySp = fmtSpread(g.spread_home === null ? null : -sp);
  var html = '<div class="ticket' + (frozen ? ' locked' : '') + '">'
    + '<div class="meta"><span>' + esc(fmtTime(g.commence_time)) + '</span><span>' + (noLine ? 'LINE TBD' : esc((g.bookmaker || '').toUpperCase()) + ' LINE') + '</span></div>'
    + '<div class="sides">'
    + sideBtn(g, 'away', g.away_team, awaySp, sp > 0, mp, frozen)
    + sideBtn(g, 'home', g.home_team, homeSp, sp < 0, mp, frozen)
    + '</div>';
  if (g.completed) html += '<div class="score">FINAL: <b>' + esc(g.away_team) + ' ' + g.away_score + '</b> \u2014 <b>' + esc(g.home_team) + ' ' + g.home_score + '</b></div>';
  return html + '</div>';
}

// A college slate runs to 70+ games, so split it: anything with an AP Top 25 team on the
// field, then everything else. Each side collapses; a group holding one of your picks
// always opens.
function groupedGames(games, lg){
  var ap = S.data.apRanks;
  if (lg !== 'cfb' || !ap || games.length < 12) return null;
  var top = [], rest = [];
  games.forEach(function(g){
    (apRank(g.home_team) || apRank(g.away_team) ? top : rest).push(g);
  });
  if (!top.length || !rest.length) return null;
  return [
    { key: 'top25', label: 'AP Top 25', games: top },
    { key: 'rest', label: 'Everything Else', games: rest }
  ];
}

function groupHtml(grp, locked){
  var d = S.data;
  var mine = grp.games.filter(function(g){ return !!pickFor(g.id, d.me.id); }).length;
  var open = S.groupOpen[grp.key];
  if (open === undefined) open = grp.key === 'top25' || mine > 0;
  var count = grp.games.length + ' game' + (grp.games.length === 1 ? '' : 's')
    + (mine ? ' \u00b7 ' + mine + ' picked' : '');
  var html = '<button class="grouphead' + (open ? ' open' : '') + '" data-grp="' + grp.key + '">'
    + '<span><span class="gt">' + esc(grp.label) + '</span><span class="gn' + (mine ? ' has' : '') + '">' + count + '</span></span>'
    + '<span class="gc">\u25be</span></button>'
    + '<div class="groupbody' + (open ? '' : ' shut') + '">';
  grp.games.forEach(function(g){ html += ticketHtml(g, locked); });
  return html + '</div>';
}

function sideBtn(g, side, team, spread, isFav, myPick, frozen){
  var mine = myPick && myPick.side === side;
  var cls = 'side' + (mine ? ' mine' : '') + (frozen ? ' dead' : '');
  var stamp = '';
  if (mine && myPick.result) stamp = '<div class="stamp ' + myPick.result + '">' + myPick.result.toUpperCase() + '</div>';
  var lockedSp = mine && myPick.spread_home_at_pick !== null && myPick.spread_home_at_pick !== undefined
    ? fmtSpread(side === 'home' ? myPick.spread_home_at_pick : -Number(myPick.spread_home_at_pick)) : spread;
  return '<div class="' + cls + '"' + (frozen ? '' : ' data-g="' + g.id + '" data-s="' + side + '"') + '>'
    + '<div class="tm">' + rankBadge(team) + esc(team) + '</div>'
    + '<div class="sp' + (isFav ? ' fav' : '') + '">' + (mine ? lockedSp : spread) + '</div>'
    + moveNote(g, side) + stamp + '</div>';
}

function renderBoard(){
  var d = S.data, w = d.week, root = el('tab-board');
  if (!w) { root.innerHTML = '<div class="empty"><span class="big">Nothing on the board</span></div>'; return; }
  var html = '<div class="sechead"><h3>' + esc(w.label || ('Week ' + w.week_no)) + ' Board</h3></div>';
  // when do picks flip face-up?
  var revs = '', anyRevealed = false;
  ['cfb','nfl'].forEach(function(lg){
    var req = lg === 'cfb' ? w.cfb_required : w.nfl_required;
    var lock = lg === 'cfb' ? w.cfb_lock : w.nfl_lock;
    if (req <= 0 || !lock) return;
    if (leagueLocked(w, lg)) { anyRevealed = true; revs += '<div>' + sportLabel(w, lg) + ' picks: <b>revealed</b></div>'; }
    else revs += '<div>' + sportLabel(w, lg) + ' picks reveal ' + esc(fmtTime(lock)) + ' · <span class="cdi" data-deadline="' + esc(lock) + '">' + fmtCountdown(new Date(lock).getTime() - now()) + '</span></div>';
  });
  if (revs) html += '<div class="revstrip">' + revs + '</div>';
  html += '<p class="hint" style="color:#87a794;font-size:12.5px;margin-bottom:6px">Everyone’s picks stay hidden until that league’s lock passes.</p>';
  html += '<div class="revstrip" style="line-height:1.55;font-size:12.5px">🍆 <b>The Worst-Pick Call:</b> each week you get <b>one 🍆</b> to plant on a rival’s pick — the one you think is doomed. '
    + (anyRevealed ? '<b>Open now:</b> tap the 🍆 next to any rival pick below.' : 'It opens the moment picks are revealed (see countdown above).')
    + ' Move it as often as you like, but each game closes to 🍆 at first pitch / kickoff — and once the game you flagged starts, your 🍆 is locked in for the week. One 🍆 covers <b>every rival on the same bet</b> (same team, same game). If the flagged bet loses, you score a 🍆✓ per player you caught.</div>';
  var eggs = d.eggplants || [];
  function eggAnchor(egg){ return d.picks.find(function(x){ return x.id === egg.pick_id; }); }
  function eggCovers(egg, p){
    if (egg.flagger_id === p.player_id) return false; // a flag never lands on the flagger's own pick
    var a = eggAnchor(egg);
    return !!a && a.game_id === p.game_id && a.side === p.side;
  }
  d.players.forEach(function(pl){
    var picks = d.picks.filter(function(p){ return p.player_id === pl.id; });
    var wn = 0, ln = 0, pn = 0;
    picks.forEach(function(p){ if (p.result === 'win') wn++; else if (p.result === 'loss') ln++; else if (p.result === 'push') pn++; });
    html += '<div class="playerblock"><h4>' + esc(pl.name) + '<span class="rec">' + wn + '-' + ln + (pn ? '-' + pn : '') + '</span></h4>';
    var rows = '';
    picks.sort(function(a,b){
      var ga = gameById(a.game_id), gb = gameById(b.game_id);
      return (ga.league > gb.league ? 1 : ga.league < gb.league ? -1 : 0) || new Date(ga.commence_time) - new Date(gb.commence_time);
    }).forEach(function(p){
      var g = gameById(p.game_id); if (!g) return;
      var team = p.side === 'home' ? g.home_team : g.away_team;
      var spH = p.spread_home_at_pick !== null && p.spread_home_at_pick !== undefined ? p.spread_home_at_pick : g.spread_home;
      var spread = fmtSpread(p.side === 'home' ? spH : (spH === null ? null : -Number(spH)));
      var res = p.result ? '<span class="res ' + p.result + '">' + p.result.toUpperCase() + '</span>' : '<span class="res tbd">TBD</span>';
      var flags = eggs.filter(function(e){ return e.flagger_id !== d.me.id && eggCovers(e, p); });
      var flagHtml = '';
      if (flags.length) {
        var names = flags.map(function(e){ var f = d.players.find(function(x){ return x.id === e.flagger_id; }); return f ? f.name : '?'; }).join(', ');
        var emo = ''; for (var i = 0; i < flags.length; i++) emo += '🍆';
        flagHtml = '<span class="eggflags" title="Called worst by ' + esc(names) + '">' + emo + '</span>';
      }
      var myEgged = eggs.some(function(e){ return e.flagger_id === d.me.id && eggCovers(e, p); });
      var gStarted = new Date(g.commence_time).getTime() <= now();
      var canEgg = pl.id !== d.me.id && leagueLocked(w, g.league) && !gStarted;
      var btn = '';
      if (canEgg) btn = '<button class="egg' + (myEgged ? ' on' : '') + '" data-egg="' + p.id + '" title="Flag as worst pick of the week">🍆</button>';
      else if (myEgged) btn = '<button class="egg on" title="Locked in — game started">🍆</button>';
      var opp = p.side === 'home' ? 'vs ' + g.away_team : '@ ' + g.home_team;
      rows += '<div class="pickrow"><span class="lg">' + gameShort(g) + '</span><span class="who">' + esc(team) + flagHtml + '<span class="opp">' + esc(opp) + '</span></span><span class="num">' + spread + '</span>' + res + btn + '</div>';
    });
    var hid = d.hiddenCounts && d.hiddenCounts[pl.id];
    if (hid) {
      var parts = [];
      if (hid.cfb) parts.push(hid.cfb + ' ' + sportLabel(w, 'cfb'));
      if (hid.nfl) parts.push(hid.nfl + ' ' + sportLabel(w, 'nfl'));
      rows += '<div class="hiddennote">' + parts.join(' + ') + ' pick' + ((hid.cfb||0)+(hid.nfl||0) > 1 ? 's' : '') + ' in — hidden until lock 🔒</div>';
    }
    if (!rows) rows = '<div class="hiddennote">No picks in yet.</div>';
    html += rows + '</div>';
  });
  root.innerHTML = '<div' + (root._rendered ? '' : ' class="fade"') + '>' + html + '</div>';
  root._rendered = true;

  root.querySelectorAll('[data-egg]').forEach(function(b){
    b.addEventListener('click', function(){
      var pid = b.getAttribute('data-egg'), dd = S.data, call;
      dd.eggplants = dd.eggplants || [];
      var mine = dd.eggplants.find(function(e){ return e.flagger_id === dd.me.id; });
      var target = dd.picks.find(function(x){ return x.id === pid; });
      var mineAnchor = mine ? dd.picks.find(function(x){ return x.id === mine.pick_id; }) : null;
      var sameBet = mineAnchor && target && mineAnchor.game_id === target.game_id && mineAnchor.side === target.side;
      if (mine && sameBet) {
        dd.eggplants = dd.eggplants.filter(function(e){ return e !== mine; });
        call = api('/api/eggplant', { pick_id: null, week_id: dd.week.id });
      } else {
        if (mine) mine.pick_id = pid;
        else dd.eggplants.push({ flagger_id: dd.me.id, pick_id: pid });
        call = api('/api/eggplant', { pick_id: pid });
      }
      render();
      call.catch(function(e){ toast(e.message, true); load(); });
    });
  });
}

// Season record broken out by category: college vs NFL, favorites vs dogs, home vs road.
var SPLIT_DEFS = [['cfb','College'],['nfl','NFL'],['fav','Favorites'],['dog','Underdogs'],['home','Home'],['away','Road']];
function recLine(r){
  if (!r) return { txt: '\u2014', cls: 'none' };
  var w = r.w || 0, l = r.l || 0, p = r.p || 0;
  if (!(w + l + p)) return { txt: '\u2014', cls: 'none' };
  return { txt: w + '-' + l + (p ? '-' + p : ''), cls: w > l ? 'up' : (l > w ? 'down' : '') };
}
function splitsHtml(d){
  var any = d.standings.some(function(s){ return s.splits && (s.wins + s.losses + s.pushes) > 0; });
  if (!any) return '';
  var html = '<div class="sechead"><h3>By Category</h3></div>'
    + '<p style="color:#87a794;font-size:12px;line-height:1.5;margin:-2px 0 4px">Where each record actually comes from. <b style="color:var(--gold);font-weight:600">Favorites</b> and <b style="color:var(--gold);font-weight:600">Underdogs</b> count which side of the spread you took; pick\u2019em games sit out of that split.</p>';
  d.standings.forEach(function(s){
    var tot = s.wins + s.losses;
    var pct = tot ? Math.round(1000 * s.wins / tot) / 10 : 0;
    html += '<div class="splitcard' + (s.player_id === d.me.id ? ' me' : '') + '">'
      + '<div class="who"><span>' + esc(s.name) + '</span><span class="tot">' + s.wins + '-' + s.losses + (s.pushes ? '-' + s.pushes : '') + (tot ? ' \u00b7 ' + pct + '%' : '') + '</span></div>'
      + '<div class="cells">';
    SPLIT_DEFS.forEach(function(def){
      var r = recLine(s.splits ? s.splits[def[0]] : null);
      html += '<div class="cell"><div class="k">' + def[1] + '</div><div class="v ' + r.cls + '">' + r.txt + '</div></div>';
    });
    html += '</div></div>';
  });
  return html;
}

function renderStandings(){
  var d = S.data, root = el('tab-standings');
  var html = '<div class="sechead"><h3>Season Standings</h3></div>';
  if (!d.standings.length) {
    html += '<div class="empty"><span class="big">No players yet</span>The commissioner adds players from the Admin tab.</div>';
  } else {
    var claimed = {};
    d.players.forEach(function(p){ claimed[p.id] = p.claimed; });
    var anyGraded = d.standings.some(function(s){ return s.wins + s.losses + s.pushes > 0; });
    if (!anyGraded) html += '<p style="color:#87a794;font-size:12.5px;margin-bottom:2px">The field is set — records go live once the first picks are graded.</p>';
    html += '<table><tr><th></th><th>Player</th><th class="r">W</th><th class="r">L</th><th class="r">P</th><th class="r">Win %</th><th class="r">🍆✓</th><th class="r">🍆</th></tr>';
    d.standings.forEach(function(s, i){
      var tot = s.wins + s.losses;
      var pct = tot ? Math.round(1000 * s.wins / tot) / 10 : 0;
      var tag = claimed[s.player_id] === false ? ' <span style="color:#87a794;font-size:11px;font-weight:400">hasn’t signed in yet</span>' : '';
      html += '<tr' + (s.player_id === d.me.id ? ' class="me"' : '') + '><td class="rank">' + (anyGraded ? (i+1) : '•') + '</td><td class="nm">' + esc(s.name) + tag + '</td>'
        + '<td class="r mono">' + s.wins + '</td><td class="r mono">' + s.losses + '</td><td class="r mono">' + s.pushes + '</td>'
        + '<td class="r mono">' + (tot ? pct + '%' : '—') + '</td>'
        + '<td class="r mono">' + (s.egg_hits || 0) + '</td><td class="r mono">' + (s.egg_received || 0) + '</td></tr>';
    });
    html += '</table>';
    html += splitsHtml(d);
    html += '<p style="color:#87a794;font-size:12px;line-height:1.5">🍆✓ = worst-pick calls that lost — one per player caught, since a 🍆 covers everyone on the same bet · 🍆 = times one of your picks was covered by a flag. Each player gets one 🍆 per week, placed after reveal.</p>';
  }
  root.innerHTML = '<div class="fade">' + html + '</div>';
}

// ---------- trends ----------
// Four charts over the season so far. The numbers come from TR (the same trends.ts the
// iOS app ships); this half only draws them. Player colors follow the alphabetical
// roster, so filtering never repaints anyone.
var TRS = { hist: null, loading: false, filter: 'all', mode: 'ahead', focus: null, split: 0, table: false };

function loadHistory(force){
  if (TRS.loading || (TRS.hist && !force)) return;
  TRS.loading = true;
  api('/api/history').then(function(h){ TRS.hist = h; TRS.loading = false; if (S.tab === 'trends') renderTrends(); })
    .catch(function(e){ TRS.loading = false; toast(e.message, true); });
}

function pColor(slot){ return 'var(--p' + (slot % 4) + ')'; }
function fmtPct(x){ return x === null ? '—' : Math.round(x * 100) + '%'; }
function niceStep(span){
  var raw = span / 4, mag = Math.pow(10, Math.floor(Math.log10(Math.max(raw, 0.0001))));
  var n = raw / mag;
  return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 5 ? 5 : 10) * mag;
}

function renderTrends(){
  var root = el('tab-trends');
  var h = TRS.hist;
  if (!h) {
    root.innerHTML = '<div class="empty"><span class="big">Pulling the tape</span>Loading the season…</div>';
    loadHistory();
    return;
  }
  if (!h.picks.length) {
    root.innerHTML = '<div class="empty"><span class="big">No tape yet</span>Charts fill in once the first picks are graded.</div>';
    return;
  }
  if (!TRS.focus) TRS.focus = S.data.me.id;
  var roster = TR.rosterOrder(h);
  var html = '<div class="fade">';

  // filter row: applies to the race, the tiles and the grid
  html += '<div class="sechead"><h3>Trends</h3><span class="count">' + h.season + '</span></div>'
    + '<div class="chips" role="tablist" aria-label="Filter by category">';
  TR.FILTERS.forEach(function(f){
    html += '<button class="chip' + (TRS.filter === f.key ? ' on' : '') + '" data-tf="' + f.key + '" role="tab" aria-selected="' + (TRS.filter === f.key) + '">' + f.label + '</button>';
  });
  html += '</div>';

  // legend doubles as the spotlight picker
  html += '<div class="legend" aria-label="Spotlight a player">';
  roster.forEach(function(p){
    html += '<button class="lg-item' + (TRS.focus === p.id ? ' on' : '') + '" data-focus="' + p.id + '">'
      + '<i style="background:' + pColor(p.slot) + '"></i>' + esc(p.name) + (p.id === S.data.me.id ? ' <em>you</em>' : '') + '</button>';
  });
  html += '</div>';

  var race = TR.race(h, TRS.filter);
  html += tilesHtml(h, race);

  // 1 · the race
  html += '<div class="chartcard"><div class="ch-head"><div><h4>The Race</h4><p class="ch-sub">'
    + (TRS.mode === 'ahead' ? 'Games ahead of (or behind) the average of everyone else' : 'Running wins minus losses')
    + '</p></div><div class="mini-seg">'
    + '<button data-tm="ahead" class="' + (TRS.mode === 'ahead' ? 'on' : '') + '">vs field</button>'
    + '<button data-tm="net" class="' + (TRS.mode === 'net' ? 'on' : '') + '">W−L</button></div></div>'
    + '<div class="plot" id="race-plot"></div>'
    + '<button class="linkbtn" data-ttable="1">' + (TRS.table ? 'Hide' : 'Show') + ' the numbers</button>'
    + (TRS.table ? raceTable(race) : '') + '</div>';

  // 2 · heat grid
  html += gridHtml(h);

  // 3 · splits
  html += splitsChartHtml(h);

  // 4 · eggplants
  html += eggHtml(h);

  html += '<p class="fineprint">Pushes never count for or against. Favorites and underdogs are which side of the spread you took; pick’em games sit out of that split.</p></div>';
  root.innerHTML = html;
  drawRace(race);
  // newest weeks first: the grid opens scrolled to its right edge
  var hw = el('heat-wrap'); if (hw) hw.scrollLeft = hw.scrollWidth;
  wireTrends();
}

function tilesHtml(h, race){
  // leader, hot hand (last three weeks), best single week, all under the current filter
  var last = function(s){ return s.points[s.points.length - 1]; };
  var leader = race.series.slice().sort(function(a, b){ return last(b).net - last(a).net; })[0];
  var weeks = race.weeks;
  var hot = null, best = null;
  race.series.forEach(function(s){
    var pts = s.points, n = pts.length - 1;
    var from = pts[Math.max(0, n - 3)];
    var run = last(s).net - from.net;
    if (!hot || run > hot.v) hot = { s: s, v: run, n: Math.min(3, n) };
    for (var i = 1; i < pts.length; i++) {
      var wk = pts[i].net - pts[i - 1].net;
      if (!best || wk > best.v) best = { s: s, v: wk, label: pts[i].label };
    }
  });
  function tile(k, s, v, sub){
    return '<div class="tile"><div class="tk">' + k + '</div><div class="tv"><i style="background:' + pColor(s.slot) + '"></i>' + esc(s.name) + '</div>'
      + '<div class="ts"><b>' + v + '</b> ' + sub + '</div></div>';
  }
  if (!weeks.length) return '';
  return '<div class="tiles">'
    + tile('Leader', leader, TR.signed(last(leader).net), TR.recText(last(leader).rec))
    + tile('Hot hand', hot.s, TR.signed(hot.v), 'last ' + hot.n + ' wk' + (hot.n === 1 ? '' : 's'))
    + tile('Best week', best.s, TR.signed(best.v), esc(best.label))
    + '</div>';
}

function raceTable(race){
  var key = TRS.mode === 'ahead' ? 'ahead' : 'net';
  var html = '<div class="tblwrap"><table class="mini"><tr><th>Player</th>';
  race.series[0].points.slice(1).forEach(function(p){ html += '<th class="r">' + TR.weekShort(p.w) + '</th>'; });
  html += '</tr>';
  race.series.forEach(function(s){
    html += '<tr><td class="nm">' + esc(s.name) + '</td>';
    s.points.slice(1).forEach(function(p){ html += '<td class="r mono">' + TR.signed(p[key], key === 'ahead' ? 1 : 0) + '</td>'; });
    html += '</tr>';
  });
  return html + '</table></div>';
}

function drawRace(race){
  var host = el('race-plot');
  if (!host) return;
  var key = TRS.mode === 'ahead' ? 'ahead' : 'net';
  var W = Math.max(280, host.clientWidth), H = 236;
  var m = { l: 30, r: 74, t: 12, b: 26 };
  var n = race.series[0].points.length;
  var vals = [0];
  race.series.forEach(function(s){ s.points.forEach(function(p){ vals.push(p[key]); }); });
  var lo = Math.min.apply(null, vals), hi = Math.max.apply(null, vals);
  if (hi - lo < 4) { hi += 2; lo -= 2; }
  var step = niceStep(hi - lo);
  lo = Math.floor(lo / step) * step; hi = Math.ceil(hi / step) * step;
  var x = function(i){ return m.l + (n === 1 ? 0 : i * (W - m.l - m.r) / (n - 1)); };
  var y = function(v){ return m.t + (hi - v) * (H - m.t - m.b) / (hi - lo); };

  var svg = '<svg width="' + W + '" height="' + H + '" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Season race chart">';
  for (var v = lo; v <= hi + 1e-9; v += step) {
    var yy = y(v);
    svg += '<line x1="' + m.l + '" x2="' + (W - m.r + 6) + '" y1="' + yy + '" y2="' + yy + '" class="' + (Math.abs(v) < 1e-9 ? 'g-zero' : 'g-line') + '"/>'
      + '<text x="' + (m.l - 7) + '" y="' + (yy + 3.5) + '" class="g-tick" text-anchor="end">' + TR.signed(v) + '</text>';
  }
  race.series[0].points.forEach(function(p, i){
    if (n > 9 && i % 2 && i !== n - 1) return;
    svg += '<text x="' + x(i) + '" y="' + (H - 8) + '" class="g-tick" text-anchor="middle">' + (p.w === null ? 'Start' : TR.weekShort(p.w)) + '</text>';
  });
  // spotlight last, so it draws on top
  var order = race.series.slice().sort(function(a, b){ return (a.id === TRS.focus) - (b.id === TRS.focus); });
  order.forEach(function(s){
    var on = s.id === TRS.focus;
    var d = s.points.map(function(p, i){ return (i ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(p[key]).toFixed(1); }).join(' ');
    svg += '<path d="' + d + '" fill="none" stroke="' + pColor(s.slot) + '" stroke-width="' + (on ? 3 : 2) + '" stroke-linejoin="round" stroke-linecap="round" opacity="' + (on ? 1 : 0.45) + '"/>';
    var lp = s.points[n - 1];
    svg += '<circle cx="' + x(n - 1) + '" cy="' + y(lp[key]) + '" r="' + (on ? 4.5 : 3.5) + '" fill="' + pColor(s.slot) + '" stroke="var(--felt2)" stroke-width="2" opacity="' + (on ? 1 : 0.7) + '"/>';
  });
  // end labels, nudged apart so names never collide
  var labels = race.series.map(function(s){ var lp = s.points[n - 1]; return { s: s, y: y(lp[key]), v: lp[key] }; })
    .sort(function(a, b){ return a.y - b.y; });
  for (var i = 1; i < labels.length; i++) if (labels[i].y - labels[i - 1].y < 14) labels[i].y = labels[i - 1].y + 14;
  var over = labels.length ? labels[labels.length - 1].y - (H - m.b) : 0;
  if (over > 0) labels.forEach(function(l){ l.y -= over; });
  labels.forEach(function(l){
    var on = l.s.id === TRS.focus;
    svg += '<text x="' + (W - m.r + 12) + '" y="' + (l.y + 4) + '" class="g-end' + (on ? ' on' : '') + '">' + esc(l.s.name) + ' <tspan class="g-endv">' + TR.signed(l.v, key === 'ahead' ? 1 : 0) + '</tspan></text>';
  });
  svg += '<line id="race-x" x1="0" x2="0" y1="' + m.t + '" y2="' + (H - m.b) + '" class="g-cross" visibility="hidden"/>'
    + '<g id="race-dots"></g>'
    + '<rect x="' + (m.l - 10) + '" y="0" width="' + (W - m.l - m.r + 20) + '" height="' + H + '" fill="transparent" id="race-hit"/>'
    + '</svg><div class="tip" id="race-tip" hidden></div>';
  host.innerHTML = svg;

  var hit = el('race-hit'), tip = el('race-tip'), cross = el('race-x'), dots = el('race-dots');
  function show(evt){
    var box = host.getBoundingClientRect();
    var px = evt.clientX - box.left;
    var i = Math.max(0, Math.min(n - 1, Math.round((px - m.l) / ((W - m.l - m.r) / Math.max(1, n - 1)))));
    var xx = x(i);
    cross.setAttribute('x1', xx); cross.setAttribute('x2', xx); cross.setAttribute('visibility', 'visible');
    var rows = race.series.map(function(s){ return { s: s, p: s.points[i] }; }).sort(function(a, b){ return b.p[key] - a.p[key]; });
    dots.innerHTML = rows.map(function(r){
      return '<circle cx="' + xx + '" cy="' + y(r.p[key]) + '" r="4.5" fill="' + pColor(r.s.slot) + '" stroke="var(--felt2)" stroke-width="2"/>';
    }).join('');
    tip.innerHTML = '<div class="tt">' + esc(race.series[0].points[i].label) + '</div>' + rows.map(function(r){
      return '<div class="tr' + (r.s.id === TRS.focus ? ' on' : '') + '"><i style="background:' + pColor(r.s.slot) + '"></i><span>' + esc(r.s.name) + '</span><b>'
        + TR.signed(r.p[key], key === 'ahead' ? 1 : 0) + '</b><em>' + TR.recText(r.p.rec) + '</em></div>';
    }).join('');
    tip.hidden = false;
    var tw = tip.offsetWidth;
    tip.style.left = Math.max(0, Math.min(W - tw, xx + (xx > W / 2 ? -tw - 12 : 12))) + 'px';
    tip.style.top = '6px';
  }
  function hide(){ tip.hidden = true; cross.setAttribute('visibility', 'hidden'); dots.innerHTML = ''; }
  hit.addEventListener('pointermove', show);
  hit.addEventListener('pointerdown', show);
  hit.addEventListener('pointerleave', function(e){ if (e.pointerType === 'mouse') hide(); });
}

function cellClass(r){
  if (!r) return 'hc none';
  var v = TR.net(r), a = Math.abs(v);
  if (!v) return 'hc mid';
  return 'hc ' + (v > 0 ? 'pos' : 'neg') + (a >= 4 ? 3 : a >= 2 ? 2 : 1);
}
function gridHtml(h){
  var g = TR.grid(h, TRS.filter);
  var html = '<div class="chartcard"><div class="ch-head"><div><h4>Week by Week</h4><p class="ch-sub">Each week’s record' + (TRS.filter === 'all' ? '' : ' · ' + esc(TR.filterLabel(TRS.filter)) + ' only') + '</p></div></div>'
    + '<div class="tblwrap heatwrap" id="heat-wrap"><table class="heat"><tr><th></th>';
  g.weeks.forEach(function(wk){ html += '<th>' + TR.weekShort(wk) + '</th>'; });
  html += '<th class="tot">Total</th></tr>';
  g.rows.forEach(function(r){
    html += '<tr class="' + (r.id === TRS.focus ? 'on' : '') + '"><td class="nm"><i style="background:' + pColor(r.slot) + '"></i>' + esc(r.name) + '</td>';
    r.cells.forEach(function(c, i){
      var t = c ? esc(r.name) + ' · ' + esc(TR.weekLabel(h, g.weeks[i])) + ' · ' + TR.recText(c) + ' (' + TR.signed(TR.net(c)) + ')' : esc(r.name) + ' · no picks of this kind';
      html += '<td><span class="' + cellClass(c) + '" title="' + t + '" aria-label="' + t + '">' + (c ? TR.recText(c) : '·') + '</span></td>';
    });
    html += '<td class="tot mono">' + TR.recText(r.total) + '</td></tr>';
  });
  html += '</table></div><div class="scale"><span>Losing week</span><i class="hc neg3"></i><i class="hc neg2"></i><i class="hc neg1"></i><i class="hc mid"></i><i class="hc pos1"></i><i class="hc pos2"></i><i class="hc pos3"></i><span>Winning week</span></div></div>';
  return html;
}

function splitsChartHtml(h){
  var all = TR.splits(h);
  var pair = all[TRS.split] || all[0];
  var html = '<div class="chartcard"><div class="ch-head"><div><h4>Category Splits</h4><p class="ch-sub">Win rate, each player against the pool</p></div></div>'
    + '<div class="mini-seg wide">';
  all.forEach(function(p, i){ html += '<button data-tsplit="' + i + '" class="' + (i === TRS.split ? 'on' : '') + '">' + esc(p.title) + '</button>'; });
  html += '</div>';
  pair.groups.forEach(function(gr){
    html += '<div class="sp-group"><div class="sp-title">' + esc(gr.label) + '<span>Pool ' + fmtPct(gr.poolPct) + ' · ' + TR.recText(gr.pool) + '</span></div>';
    gr.players.forEach(function(p){
      var w = p.pct === null ? 0 : p.pct * 100;
      var diff = p.pct === null || gr.poolPct === null ? '' : ' <em class="' + (p.pct >= gr.poolPct ? 'up' : 'down') + '">' + TR.signed(Math.round((p.pct - gr.poolPct) * 100)) + '</em>';
      html += '<div class="sp-row' + (p.id === TRS.focus ? ' on' : '') + '" title="' + esc(p.name) + ' · ' + esc(gr.label) + ' · ' + TR.recText(p.rec) + '">'
        + '<span class="sp-nm">' + esc(p.name) + '</span>'
        + '<span class="sp-track"><span class="sp-bar" style="width:' + w + '%;background:' + pColor(p.slot) + '"></span>'
        + '<span class="sp-50"></span>'
        + (gr.poolPct === null ? '' : '<span class="sp-pool" style="left:' + (gr.poolPct * 100) + '%"></span>') + '</span>'
        + '<span class="sp-v">' + fmtPct(p.pct) + diff + '<small>' + TR.recText(p.rec) + '</small></span></div>';
    });
    html += '</div>';
  });
  html += '<div class="sp-key"><span class="k-pool"></span> pool rate <span class="k-50"></span> 50%</div></div>';
  return html;
}

// only non-empty segments, so a zero never leaves a stray gap at the start of a bar
function segs(parts){
  return parts.filter(function(p){ return p[1] > 0; }).map(function(p){ return '<span class="eg-fill ' + p[0] + '" style="width:' + (100 * p[1]) + '%"></span>'; }).join('');
}
function eggHtml(h){
  var rows = TR.eggScore(h);
  if (!rows.some(function(r){ return r.thrown || r.flagged; })) return '';
  var maxT = Math.max.apply(null, rows.map(function(r){ return r.thrown; }).concat([1]));
  var maxF = Math.max.apply(null, rows.map(function(r){ return r.flagged; }).concat([1]));
  var sharp = rows.filter(function(r){ return r.hitRate !== null; }).sort(function(a, b){ return b.hitRate - a.hitRate || b.hits - a.hits; })[0];
  var hated = rows.slice().sort(function(a, b){ return b.flagged - a.flagged; })[0];
  var html = '<div class="chartcard"><div class="ch-head"><div><h4>🍆 Scorecard</h4><p class="ch-sub">Calls that landed, and who keeps getting flagged</p></div></div>'
    + '<div class="egg-sup">' + (sharp ? '<span>Sharpest eye: <b>' + esc(sharp.name) + '</b> ' + fmtPct(sharp.hitRate) + '</span>' : '')
    + '<span>Most flagged: <b>' + esc(hated.name) + '</b> ×' + hated.flagged + '</span></div>'
    + '<div class="egg-grid"><div class="eg-h"></div><div class="eg-h">Calls · <b class="k-hit">landed</b></div><div class="eg-h">Flagged · <b class="k-burn">it lost</b></div>';
  rows.forEach(function(r){
    html += '<div class="eg-nm' + (r.id === TRS.focus ? ' on' : '') + '"><i style="background:' + pColor(r.slot) + '"></i>' + esc(r.name) + '</div>'
      + '<div class="eg-cell" title="' + esc(r.name) + ': ' + r.thrown + ' calls, ' + r.hits + ' landed, ' + r.misses + ' missed">'
      + '<span class="eg-track">' + segs([['hit', r.hits / maxT], ['rest', (r.thrown - r.hits) / maxT]]) + '</span>'
      + '<span class="eg-v">' + r.hits + '/' + r.thrown + '</span></div>'
      + '<div class="eg-cell" title="' + esc(r.name) + ': flagged ' + r.flagged + ' times, lost ' + r.burned + ', survived ' + r.survived + '">'
      + '<span class="eg-track">' + segs([['burn', r.burned / maxF], ['rest', (r.flagged - r.burned) / maxF]]) + '</span>'
      + '<span class="eg-v">' + r.burned + '/' + r.flagged + '</span></div>';
  });
  return html + '</div></div>';
}

  root.querySelectorAll('[data-tf]').forEach(function(b){ b.addEventListener('click', function(){ TRS.filter = b.getAttribute('data-tf'); renderTrends(); }); });
  root.querySelectorAll('[data-focus]').forEach(function(b){ b.addEventListener('click', function(){ TRS.focus = b.getAttribute('data-focus'); renderTrends(); }); });
  root.querySelectorAll('[data-tm]').forEach(function(b){ b.addEventListener('click', function(){ TRS.mode = b.getAttribute('data-tm'); renderTrends(); }); });
  root.querySelectorAll('[data-tsplit]').forEach(function(b){ b.addEventListener('click', function(){ TRS.split = Number(b.getAttribute('data-tsplit')); renderTrends(); }); });

}

// The pool locks on Central time (10am Saturday in Chicago), whatever timezone the
// commissioner's browser is in, and it follows Chicago across daylight saving.
function nextCentral(dow, hour){
  var fmt = new Intl.DateTimeFormat('en-US', { timeZone: 'America/Chicago', year: 'numeric', month: 'numeric', day: 'numeric', hour: 'numeric', hourCycle: 'h23', weekday: 'short' });
  var DOW = { Sun: 0, Mon: 1, Tue: 2, Wed: 3, Thu: 4, Fri: 5, Sat: 6 };
  function parts(t){ var o = {}; fmt.formatToParts(new Date(t)).forEach(function(p){ o[p.type] = p.value; }); return o; }
  for (var i = 0; i < 9; i++) {
    var p = parts(Date.now() + i * 86400000);
    if (DOW[p.weekday] !== dow) continue;
    for (var off = 5; off <= 6; off++) {   // CDT is UTC-5, CST is UTC-6
      var t = Date.UTC(+p.year, +p.month - 1, +p.day, hour + off);
      if (+parts(t).hour === hour && t > Date.now()) return new Date(t).toISOString();
    }
  }
  return new Date(Date.now() + 7 * 86400000).toISOString();
}

  });
});

// countdowns tick
setInterval(function(){
  document.querySelectorAll('[data-deadline]').forEach(function(n){
    var ms = new Date(n.getAttribute('data-deadline')).getTime() - now();
    var txt = fmtCountdown(ms);
    if (n.textContent !== txt) n.textContent = txt;
    if (ms <= 0 && !n._lockedOnce) { n._lockedOnce = true; load(); }
  });
}, 1000);
// refresh data every 5 min while open
setInterval(function(){ if (S.token) load(); }, 300000);

if (S.token) load(); else render();
})();
</script>
</body>
